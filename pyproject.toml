[project]
name = "reportnet-api"
version = "0.1.3"
description = "Python library for the EEA Reportnet 3 REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["reportnet", "api-client", "rest-api", "pandas", "jupyter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
authors = [{ name = "Nikos Paximadakis", email = "nikos.paximadakis@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
pandas = ["pandas>=2"]

[project.scripts]
reportnet = "reportnet_api.cli:main"

[project.urls]
Homepage = "https://github.com/eeadata/reportnet-api-python"
Repository = "https://github.com/eeadata/reportnet-api-python"
Issues = "https://github.com/eeadata/reportnet-api-python/issues"

[dependency-groups]
dev = [
    "pandas>=2",
    "datamodel-code-generator>=0.25",
    "mypy>=1.11",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
ui = [
    "streamlit>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reportnet_api"]

[tool.ruff]
extend-exclude = ["examples"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "RUF", "S", "PL", "DTZ", "PTH", "FBT", "PT", "SIM", "C4", "RET",
]
# ANN is left out on purpose: mypy strict already enforces annotations.
ignore = [
    "PLR0913",  # resource methods mirror the endpoint's parameters
    "PLC0415",  # pandas is imported lazily so that it stays optional
    "FBT001",   # boolean parameters are public API; changing them is a breaking change
    "FBT002",   # same
    "PT018",    # splitting compound asserts is churn; pytest already shows both sides
    "SIM117",   # nested `with` blocks read fine; merging them is style only
    "PLR0911",  # complexity counts: splitting long, linear functions risks behaviour
    "PLR0912",  #   changes for no correctness gain; revisit case by case
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"reportnet_api/models/generated.py" = ["ALL"]
"reportnet_api/resources/*.py" = ["E501"]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "FBT003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["reportnet_api", "tests", "scripts", "tools"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
xfail_strict = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy's stubs use Python 3.12 syntax, which python_version 3.11 cannot parse.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# Only scripts/make_logo.py uses these, installed ad hoc with `uv run --with`.
module = ["cairosvg", "fontTools.*"]
ignore_missing_imports = true
